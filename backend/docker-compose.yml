services:
  bgc_searchapi:    
    container_name: bgc_searchapi
    build:
      context: .
      dockerfile: BGC.SearchApi/dockerfile      
      args:
        - BUILD_CONFIGURATION=Debug
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:8080
      - VSDBG_WAIT_FOR_DEBUGGER=1
    env_file:
      - .env
    ports:
      - 5164:8080
      - 7226:443
      - 4711:4711
    volumes:
      - ${ASPNETCORE_USER_SECRETS_PATH}:/root/.microsoft/usersecrets:ro
      - ~/.aspnet/https:/https:ro
    depends_on:
      mongo:
        condition: service_healthy  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data: