name: Claude PR Review

# Trigger: a maintainer (OWNER, MEMBER, or COLLABORATOR) comments `/claude review`
# on a pull request. Automatic triggers on open/sync have been removed so that
# reviews only run on explicit request.
on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Guard: comment must be on a PR, contain the trigger phrase, and come from
    # someone with write access (author_association OWNER/MEMBER/COLLABORATOR).
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --json headRefName -q .headRefName)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Run in tag mode with a tracking comment. This is what starts the
          # github_inline_comment MCP server; without it the
          # mcp__github_inline_comment__create_inline_comment tool referenced in
          # claude_args/prompt below does not exist, and the run ends with
          # is_error:true when Claude tries to post inline review comments.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request. Follow any repo conventions in CLAUDE.md
            and docs/agents/, and focus on:
            - Correctness and potential bugs
            - Security implications
            - Adherence to this repo's documented coding standards
            - Whether the change matches its originating issue/PR description

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as chat messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
